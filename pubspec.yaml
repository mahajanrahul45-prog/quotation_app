name: quotation_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 🔹 For WhatsApp & Browser opening
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # 🔹 PDF generation and printing
  pdf: ^3.11.0
  printing: ^5.12.0

  # 🔹 Excel export
  excel: ^4.0.3

  # 🔹 Path access (for saving files locally)
  path_provider: ^2.1.4

  # 🔹 Image Picker
  image_picker: ^1.1.1

  marquee: ^2.2.3   # 👈 ADD THIS LINE

  # 🔹 Local Storage
  shared_preferences: ^2.3.3

  # 📂 File picker for importing Excel
  file_picker: ^8.0.0

  # ⬇️ NEW — Used for sending PDF to WhatsApp (share from device)
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
