name: elevator_quotation_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  
  # 🔥 FIREBASE (NEW – REQUIRED)
  firebase_core: ^4.15.0        # Core Firebase initialization
  firebase_auth: ^6.7.0
  crypto: ^3.0.6
  archive: ^3.6.1
  cloud_firestore: ^6.10.0      # Firestore database

  path: ^1.9.0   # ✅ ADD THIS

  # 🔹 For WhatsApp & Browser opening
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # 🔹 PDF generation and printing
  pdf: ^3.11.0
  printing: ^5.12.0

  # 🔹 Excel export
  excel: ^4.0.3

  # 🔹 Path access (for saving files locally)
  path_provider: ^2.1.4

  # 🔹 Image Picker
  image_picker: ^1.1.1
  web: ^1.1.1

  # ✍️ Signature pad (for drawing customer signature)
  signature: ^5.4.0

  marquee: ^2.2.3

  # 🔹 Local Storage
  shared_preferences: ^2.3.3

  local_auth: ^2.2.0   # ✅ ADD THIS

  # 📂 File picker for importing Excel
  file_picker: ^10.3.7

  # ⬇️ NEW — Used for sending PDF to WhatsApp (share from device)
  share_plus: ^12.0.1

  # 🔔 Expiring maintenance reminders
  flutter_local_notifications: ^19.4.0
  workmanager: ^0.9.0+3
  speech_to_text: 7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Use this newer version so it is compatible with image 4.x used by pdf package
  flutter_launcher_icons: ^0.14.4

# flutter_launcher_icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#16324F"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # --------------------------------------------
  # 📂 ASSETS (icons, images, etc.)
  # --------------------------------------------
  assets:
    - assets/icon/
    - assets/fonts/        # 👈 ADD THIS FOLDER FOR CUSTOM FONTS

  # --------------------------------------------
  # 🔤 CUSTOM FONTS SETUP (ONE TIME)
  # --------------------------------------------
  # We are adding fonts for Company Details page
  # and PDF / Print preview later.
  #
  # Fonts included:
  # 1) Oxanium  → matches your attached image style
  # 2) Montserrat → clean business font
  # 3) Rajdhani → technical style font
  #
  # NOTE:
  # Place these files in:
  # assets/fonts/
  #
  # Example files:
  # assets/fonts/Oxanium-Regular.ttf
  # assets/fonts/Oxanium-Bold.ttf
  # assets/fonts/Montserrat-Regular.ttf
  # assets/fonts/Rajdhani-Regular.ttf
  # --------------------------------------------

  fonts:
    - family: NotoService
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    # 🔹 IMAGE FONT (matches your logo / header style)
    - family: Oxanium
      fonts:
        - asset: assets/fonts/Oxanium-Regular.ttf
        - asset: assets/fonts/Oxanium-Bold.ttf
          weight: 700

    # 🔹 CLEAN BUSINESS FONT
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

    # 🔹 TECHNICAL LOOK FONT
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700

